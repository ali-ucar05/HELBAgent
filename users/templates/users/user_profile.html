{% extends "blog/base.html" %}
{% load static %}
{% block content %}
<div class="content-section">
    <div class="media">
        <img class="rounded-circle account-img" src="{{ target_user.profile.image.url }}">
        <div class="media-body">
            <h2 class="account-heading">{{ target_user.username }}</h2>
            <p class="text-secondary">{{ target_user.email }}</p>
        </div>
    </div>
    <hr>
    <h3>Statistics</h3>
    <canvas id="myChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{{ chartData|json_script:"chartData" }}
<script src="{% static 'users/scripts/displayUserGraph.js' %}"></script>
{% endblock content %}
